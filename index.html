<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב אימון אקורדיון</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>🪗 אימון אקורדיון</h1>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <button class="nav-btn nav-btn--active" data-tab="practice">
                <span class="nav-icon">📝</span>
                אימון יומי
            </button>
            <button class="nav-btn" data-tab="metronome">
                <span class="nav-icon">🎵</span>
                מטרונום
            </button>
            <button class="nav-btn" data-tab="progress">
                <span class="nav-icon">📈</span>
                התקדמות
            </button>
            <button class="nav-btn" data-tab="settings">
                <span class="nav-icon">⚙️</span>
                הגדרות
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main">
            <!-- Daily Practice Tab -->
            <div id="practice" class="tab-content tab-content--active">
                <div class="section">
                    <h2>אימון יומי</h2>
                    <p class="section-subtitle">תאריך: <span id="current-date"></span></p>
                    
                    <div class="exercises-list" id="exercises-list">
                        <!-- Exercises will be dynamically populated -->
                    </div>

                    <div class="daily-tip">
                        <h3>💡 טיפ היום</h3>
                        <p id="daily-tip-text"></p>
                    </div>
                </div>
            </div>

            <!-- Metronome Tab -->
            <div id="metronome" class="tab-content">
                <div class="section">
                    <h2>מטרונום</h2>
                    
                    <div class="metronome-container">
                        <div class="bpm-display">
                            <span id="bpm-value">120</span>
                            <small>BPM</small>
                        </div>
                        
                        <div class="bpm-controls">
                            <button class="btn btn--secondary btn-round" id="bpm-minus">−</button>
                            <button class="btn btn--secondary btn-round" id="bpm-plus">+</button>
                        </div>

                        <button class="btn btn--primary btn--lg metronome-btn" id="metronome-toggle">
                            <span id="metronome-text">הפעל</span>
                        </button>

                        <div class="metronome-visual" id="metronome-visual"></div>
                    </div>
                </div>
            </div>

            <!-- Progress Tab -->
            <div id="progress" class="tab-content">
                <div class="section">
                    <h2>מעקב התקדמות</h2>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="total-sessions">0</div>
                            <div class="stat-label">סה"כ אימונים</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="weekly-completion">0%</div>
                            <div class="stat-label">השלמה שבועית</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="avg-bpm">0</div>
                            <div class="stat-label">ממוצע BPM</div>
                        </div>
                    </div>

                    <div class="progress-chart-container">
                        <h3>התקדמות BPM</h3>
                        <canvas id="progress-chart" style="position: relative; height: 300px;"></canvas>
                    </div>

                    <div class="sessions-log">
                        <h3>יומן אימונים</h3>
                        <div id="sessions-list">
                            <!-- Sessions will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settings" class="tab-content">
                <div class="section">
                    <h2>הגדרות</h2>
                    
                    <div class="settings-group">
                        <h3>תרגילים</h3>
                        <div id="exercises-settings">
                            <!-- Exercise settings will be populated here -->
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">הוספת תרגיל חדש</label>
                            <input type="text" class="form-control" id="new-exercise-name" placeholder="שם התרגיל">
                            <input type="number" class="form-control" id="new-exercise-duration" placeholder="זמן בדקות" min="1" max="60">
                            <button class="btn btn--primary" id="add-exercise-btn">הוסף תרגיל</button>
                        </div>
                    </div>

                    <div class="settings-group">
                        <h3>נתונים</h3>
                        <button class="btn btn--outline" id="export-data-btn">יצוא נתונים</button>
                        <button class="btn btn--outline btn--danger" id="reset-data-btn">איפוס נתונים</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Exercise Modal -->
        <div class="modal hidden" id="exercise-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-exercise-name"></h3>
                    <button class="modal-close" id="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="timer-display">
                        <span id="timer-minutes">00</span>:<span id="timer-seconds">00</span>
                    </div>
                    
                    <div class="timer-controls">
                        <button class="btn btn--primary" id="start-timer">התחל</button>
                        <button class="btn btn--secondary" id="pause-timer">השהה</button>
                        <button class="btn btn--outline" id="reset-timer">איפוס</button>
                    </div>

                    <div class="exercise-inputs">
                        <div class="form-group">
                            <label class="form-label">BPM שהושג</label>
                            <input type="number" class="form-control" id="achieved-bpm" min="40" max="300">
                        </div>
                        <div class="form-group">
                            <label class="form-label">הערות</label>
                            <textarea class="form-control" id="exercise-notes" rows="3" placeholder="הערות על האימון..."></textarea>
                        </div>
                    </div>

                    <button class="btn btn--primary btn--full-width" id="complete-exercise">סיום תרגיל</button>
                </div>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay hidden" id="overlay"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
