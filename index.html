<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אימון אקורדיון מתקדם</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- מטרונום קבוע וגדול -->
  <div id="fixed-metronome" class="fixed-metronome">
    <div class="metronome-controls">
      <div class="metronome-visual">
        <div id="beat-circle" class="beat-circle"></div>
      </div>

      <select id="time-signature" class="time-signature-select" aria-label="משקל">
        <option value="4/4">4/4</option>
        <option value="3/4">3/4</option>
        <option value="2/4">2/4</option>
        <option value="6/8">6/8</option>
      </select>

      <input type="range" id="bpm-slider" class="bpm-slider" min="40" max="200" step="1" value="100" dir="ltr" aria-label="מהירות BPM">

      <div class="bpm-display"><span id="bpm-value">100</span> BPM</div>

      <button id="metronome-toggle" class="btn-primary metronome-toggle" aria-label="הפעל/עצור">▶️</button>
    </div>
  </div>

  <div class="main">
    <nav class="bottom-nav">
      <button class="nav-btn nav-btn--active" data-tab="practice">🎵<br>אימון יומי</button>
      <button class="nav-btn" data-tab="progress">📊<br>התקדמות</button>
      <button class="nav-btn" data-tab="settings">⚙️<br>הגדרות</button>
    </nav>

    <!-- אימון: בלי כותרת ובלי תאריך -->
    <div class="tab-content tab-content--active" id="practice">
      <div class="section">
        <div id="exercises-list" class="exercises-grid"></div>
      </div>
    </div>

    <!-- התקדמות -->
    <div class="tab-content" id="progress">
      <div class="section">
        <div class="progress-stats">
          <div class="stat-card">
            <div class="stat-value" id="stat-minutes">0</div>
            <div class="stat-label">דקות השבוע</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-sessions">0</div>
            <div class="stat-label">סשנים השבוע</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-avg-bpm">0</div>
            <div class="stat-label">BPM ממוצע</div>
          </div>
        </div>
        <canvas id="progress-chart" class="progress-canvas" aria-label="גרף התקדמות שבועי"></canvas>
      </div>
    </div>

    <!-- הגדרות -->
    <div class="tab-content" id="settings">
      <div class="section">
        <div class="settings-group">
          <h3>הגדרות מטרונום</h3>
          <div class="setting-item">
            <label>צליל:</label>
            <select id="metronome-sound">
              <option value="click">קליק</option>
              <option value="beep">ביפ</option>
              <option value="tick">טיק</option>
              <option value="wood">עץ</option>
              <option value="cowbell">קאובל</option>
            </select>
          </div>
          <div class="setting-item">
            <label>עוצמה:</label>
            <input type="range" id="volume-slider" min="0" max="100" value="70">
            <span id="volume-display">70%</span>
          </div>
        </div>

        <div class="settings-group">
          <h3>כללי</h3>
          <div class="setting-item">
            <label><input type="checkbox" id="auto-increase-bpm"> העלאה אוטומטית של BPM</label>
          </div>
          <div class="setting-item">
            <label><input type="checkbox" id="vibrate-mode"> רטט במקום צליל</label>
          </div>
          <div class="setting-item">
            <button id="reset-data" class="btn-danger">איפוס נתונים</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- מודאל עריכת תרגיל -->
  <div id="feedback-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3>עריכת תרגיל</h3>
      <form id="exercise-edit-form" class="exercise-edit-form">
        <div class="form-row">
          <label for="edit-exercise-name">שם</label>
          <input type="text" id="edit-exercise-name" required>
        </div>
        <div class="form-row two">
          <div>
            <label for="edit-exercise-duration">משך (דקות)</label>
            <input type="number" id="edit-exercise-duration" min="1" max="60" required>
          </div>
          <div>
            <label for="edit-exercise-bpm">BPM</label>
            <input type="number" id="edit-exercise-bpm" min="40" max="200" required>
          </div>
        </div>
        <div class="form-row">
          <label for="edit-exercise-description">תיאור</label>
          <textarea id="edit-exercise-description" rows="4"></textarea>
        </div>
        <div class="edit-buttons">
          <button type="button" id="save-exercise" class="btn-primary">שמור</button>
          <button type="button" id="cancel-edit" class="btn-secondary">ביטול</button>
        </div>
      </form>
    </div>
  </div>

  <!-- מודאל התאמת BPM בסיום תרגיל -->
  <div id="bpm-adjust-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3>להתאים את ה-BPM?</h3>
      <p class="bpm-adjust-text">לשנות את ה-BPM של התרגיל הנוכחי?</p>
      <div class="bpm-adjust-buttons">
        <button id="bpm-down" class="btn-secondary">להנמיך</button>
        <button id="bpm-keep" class="btn-primary">להשאיר</button>
        <button id="bpm-up" class="btn-success">להגביר</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
